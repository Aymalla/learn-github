name: Copilot PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    name: GitHub Copilot Code Review
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Add PR comment
      uses: actions/github-script@v7
      with:
        script: |
          const prNumber = context.payload.pull_request.number;
          const message = `
          ## 🤖 GitHub Copilot Tips for this PR
          
          ### For Reviewers:
          - Use GitHub Copilot Chat to understand complex code changes
          - Ask Copilot: "Explain the changes in this PR"
          - Ask Copilot: "What are potential issues with this code?"
          - Ask Copilot: "Suggest improvements for this implementation"
          
          ### For Contributors:
          - Ensure your code follows the patterns in \`.github/copilot-instructions.md\`
          - Use Copilot to generate unit tests for new functionality
          - Leverage Copilot for documentation comments
          
          ### Quick Commands:
          - \`@copilot explain this code\`
          - \`@copilot suggest tests for this function\`
          - \`@copilot find potential bugs\`
          - \`@copilot optimize this code\`
          `;
          
          github.rest.issues.createComment({
            issue_number: prNumber,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });
